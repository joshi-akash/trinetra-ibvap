services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: trinetra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_USER: trinetra_admin
      POSTGRES_PASSWORD: trinetra_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra_admin -d trinetra"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: trinetra-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trinetra-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://trinetra_admin:trinetra_secure_password@postgres:5432/trinetra
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      JWT_SECRET: trinetra_offline_jwt_secret_key_change_in_prod_32chars
      STORAGE_DIR: /app/storage
      THRESHOLDS_FILE: /app/ai_behavior/thresholds.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./ai_behavior/thresholds.yaml:/app/ai_behavior/thresholds.yaml:ro

  frontend:
    image: nginx:alpine
    container_name: trinetra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  mosquittodata:
